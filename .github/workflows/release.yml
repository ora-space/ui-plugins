name: Release

# Tag `hello-panel/v0.2.0` releases plugins/hello-panel at version 0.2.0. The
# marketplace entry is opened separately with `deno task publish` (see README).
on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin directory under plugins/ (rehearsal: no release)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Select plugin
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if ! [[ "${GITHUB_REF_NAME}" =~ ^[a-z0-9-]+/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "tag ${GITHUB_REF_NAME} is not <plugin>/v<semver>" >&2
              exit 1
            fi
            PLUGIN="${GITHUB_REF_NAME%%/*}"
            VERSION="${GITHUB_REF_NAME#*/v}"
            echo "EXPECT=--expect-version=${VERSION}" >> "$GITHUB_ENV"
            case "${VERSION}" in
              *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;;
            esac
          else
            PLUGIN="${{ inputs.plugin }}"
            echo "EXPECT=" >> "$GITHUB_ENV"
          fi
          echo "PLUGIN=${PLUGIN}" >> "$GITHUB_ENV"

      - name: Validate
        run: deno task package "${PLUGIN}" --check ${EXPECT}

      - name: Package
        run: deno task package "${PLUGIN}" --out dist ${EXPECT}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN }}
          path: |
            dist/*.orax
            dist/*.sha256

      - name: Create or update release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Reruns replace the assets; the marketplace PR must not be merged yet.
            gh release upload "${GITHUB_REF_NAME}" dist/*.orax dist/*.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.orax dist/*.sha256 \
              --title "${GITHUB_REF_NAME}" --generate-notes ${PRERELEASE:-}
          fi
