name: CI

on:
  push:
    branches: ["main"]
  pull_request: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno task lint

      - name: Test release scripts
        run: deno test scripts/publish/

      - name: Validate every plugin
        # `deno task check` / `test` / a full package of workbench plugins need
        # @ora-space/plugin-sdk on jsr; add them here once it is published.
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            deno task package "$(basename "$dir")" --check
          done
