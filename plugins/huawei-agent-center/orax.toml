resolver = 1
name = "ora-space.huawei-agent-center"
namespace = "official"
kind = "webview"
version = "0.1.0"
description = "Ora Space Huawei Agent Center surface"
homepage = "https://github.com/ora-space/ui-plugins"
license = "Apache-2.0"

[webview]
start_url = "https://ai.edevops.huawei.com/mcp/projects"
# Origins are exact in the webview model (no host suffixes); extend this list
# if the site's login flow visits further huawei.com origins.
allowed_origins = ["https://ai.edevops.huawei.com"]

[webview.downloads]
fallback = { reject = true }

[[webview.downloads.rules]]
page = { origin = "https://ai.edevops.huawei.com", path_prefix = "/" }
action = { prompt = ["import_skill", "save_as"] }
