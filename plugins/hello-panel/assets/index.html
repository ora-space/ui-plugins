<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello Panel</title>
    <!-- Inline script and style are forbidden by the workbench CSP; everything is external. -->
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1>Hello Panel</h1>
        <p class="panel__subtitle">
          页面只负责显示；计数器住在插件进程里。
        </p>
      </header>

      <section class="card" aria-labelledby="counter-title">
        <h2 id="counter-title">计数器 · 请求 / 响应</h2>
        <p class="card__hint">
          每次点击经 <code>window.ora.invoke</code> 进入进程的
          <code>counter/*</code> 方法，进程改完状态后把整份状态回给页面。
        </p>
        <div class="counter">
          <button type="button" class="button" data-action="decrement">
            −1
          </button>
          <output class="counter__value" id="count"
            aria-live="polite">0</output>
          <button type="button" class="button" data-action="increment">
            +1
          </button>
        </div>
        <button type="button" class="button button--ghost" data-action="reset">
          归零
        </button>
      </section>

      <footer class="status" id="status"
        role="status">正在连接插件进程…</footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
