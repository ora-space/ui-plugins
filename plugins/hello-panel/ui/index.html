<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello Panel</title>
    <!-- Inline script and style are forbidden by the panel CSP; everything is external. -->
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1>Hello Panel</h1>
        <p class="panel__subtitle">
          页面只负责显示；计数器和秒表都住在插件进程里。
        </p>
      </header>

      <section class="card" aria-labelledby="counter-title">
        <h2 id="counter-title">计数器 · 请求 / 响应</h2>
        <p class="card__hint">
          每次点击经 <code>surface_request</code> 进入进程的
          <code>ui/request</code>，进程改完状态后把整份状态回给页面。
        </p>
        <div class="counter">
          <button type="button" class="button" data-action="decrement">
            −1
          </button>
          <output class="counter__value" id="count"
            aria-live="polite">0</output>
          <button type="button" class="button" data-action="increment">
            +1
          </button>
        </div>
        <button type="button" class="button button--ghost" data-action="reset">
          归零
        </button>
      </section>

      <section class="card" aria-labelledby="ticker-title">
        <h2 id="ticker-title">秒表 · 进程主动推送</h2>
        <p class="card__hint">
          开始后进程每秒通过 <code>ui/push</code> 推送一次，页面只是把推送画出来。
        </p>
        <div class="ticker">
          <output class="ticker__value" id="seconds"
            aria-live="polite">0 s</output>
          <span class="ticker__state" id="ticking">已停止</span>
        </div>
        <div class="ticker__actions">
          <button type="button" class="button" data-action="startTicking">
            开始
          </button>
          <button
            type="button"
            class="button button--ghost"
            data-action="stopTicking"
          >
            停止
          </button>
        </div>
      </section>

      <footer class="status" id="status"
        role="status">正在连接插件进程…</footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
